name: Static preservation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit whitespace
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= -- .github README.md NOTICE.md THIRD_PARTY.md BUILDING.md ARCHITECTURE.md TESTING.md RESTORE.md SECURITY.md docs/evidence
          fi
      - name: Required preservation documentation
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md NOTICE.md THIRD_PARTY.md BUILDING.md ARCHITECTURE.md TESTING.md RESTORE.md SECURITY.md APPLE_LICENSE; do
            test -s "$file"
          done
          test -s docs/TRANCHE_201_RELEASE_NOTES.md
          test -s docs/TRANCHE_201_EVIDENCE.md
          test -s docs/evidence/tranche-201/summary.txt
      - name: Reject generated or oversized tracked files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files 'BUILD/**' '*.o' '*.elf' '*.img')"
          test -z "$(find . -path ./.git -prune -o -type f -size +50M -print -quit)"
